<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;background:#0d0303;color:#eff8ff;font:15px system-ui;display:flex;flex-direction:column}.toolbar-hidden header,.toolbar-hidden #session-controls{display:none}header{padding:7px 12px 4px;background:#201216;flex:none}header strong{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header small{color:#c0aeb6;font-size:12px}#status{font-size:11px;color:#bbef1f;line-height:1.2}#messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 14px;border-radius:14px;max-width:92%;line-height:1.45}.user{background:#391b27;align-self:flex-end}.assistant{background:#21191b;align-self:flex-start}.notice{color:#c0aeb6;font-size:13px}.controls{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#201216;flex:none}button{background:#38202a;color:#eff8ff;border:0;border-radius:9px;padding:8px 10px;min-height:40px}button.primary{background:#ff0055}textarea{flex:1;min-width:0;resize:none;background:#100a0c;color:#eff8ff;border:1px solid #50323b;border-radius:9px;padding:8px 10px;font:inherit;line-height:22px;min-height:40px;max-height:120px;overflow-y:auto}select{flex:1;min-width:0;max-width:100%;background:#38202a;color:#eff8ff;border:0;padding:6px;border-radius:9px;min-height:40px}
</style></head><body class="/*INITIAL_TOOLBAR_CLASS*/"><header><strong id="title">Codex</strong><small id="meta">Model and effort will appear when a session is selected</small><div id="status">Connecting…</div></header><div class="controls" id="session-controls"><select id="sessions"><option value="">Choose a session</option></select><button id="new">New</button><button id="refresh">Refresh</button></div><main id="messages"></main><div class="controls"><textarea id="prompt" rows="1" placeholder="Ask Codex…"></textarea><button class="primary" id="send">Send</button></div><script>
(function(){'use strict';window.setToolbarVisible=function(visible){document.body.classList.toggle('toolbar-hidden',!visible)};const initialThread=/*INITIAL_THREAD*/,origin=/*BASE_URL*/,status=document.getElementById('status'),messages=document.getElementById('messages'),sessions=document.getElementById('sessions'),title=document.getElementById('title'),meta=document.getElementById('meta');let ws,id=0,pending=new Map(),thread=null,stream='',answer=null,ready=false,turnBusy=false,ptyId=null;
function note(t){status.textContent=t}function add(text,role){let el=document.createElement('div');el.className='msg '+role;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}function rpc(method,params){return new Promise((resolve,reject)=>{if(!ws||ws.readyState!==1)return reject(Error('Disconnected'));let key=++id;pending.set(key,{resolve,reject});ws.send(JSON.stringify({id:key,method,params})+'\n');setTimeout(()=>{if(pending.has(key)){pending.delete(key);reject(Error('Request timed out'))}},30000)})}
function event(m){if(m.id!==undefined&&!m.method&&pending.has(m.id)){let p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(m.error.message||'Request failed')):p.resolve(m.result);return}if(m.id!==undefined&&m.method){if(m.method.endsWith('/requestApproval')){let detail=(m.params&&((m.params.command||m.params.reason)))||'Codex requests permission to proceed.';let panel=document.createElement('div');panel.className='msg notice';panel.textContent=detail;let yes=document.createElement('button'),no=document.createElement('button');yes.textContent='Allow';no.textContent='Decline';yes.onclick=()=>{ws.send(JSON.stringify({id:m.id,result:{decision:'accept'}})+'\n');panel.remove()};no.onclick=()=>{ws.send(JSON.stringify({id:m.id,result:{decision:'decline'}})+'\n');panel.remove()};panel.appendChild(yes);panel.appendChild(no);messages.appendChild(panel);note('Approval requested');}else if(m.method==='item/tool/requestUserInput'){let panel=document.createElement('div');panel.className='msg notice';let fields=[];for(const q of (m.params.questions||[])){let label=document.createElement('div');label.textContent=q.question;panel.appendChild(label);let field;if(q.options&&q.options.length){field=document.createElement('select');for(const o of q.options){let opt=document.createElement('option');opt.value=o.label;opt.textContent=o.label;field.appendChild(opt)}}else{field=document.createElement('textarea');field.placeholder='Your answer';field.rows=2}panel.appendChild(field);fields.push([q.id,field])}let send=document.createElement('button');send.textContent='Send answers';send.onclick=()=>{let answers={};for(const [key,field] of fields)answers[key]={answers:[field.value]};ws.send(JSON.stringify({id:m.id,result:{answers}})+'\n');panel.remove();note('Working…')};panel.appendChild(send);messages.appendChild(panel);note('Codex has a question')}else{note('This request needs the full Codex terminal.');ws.send(JSON.stringify({id:m.id,error:{code:-32000,message:'Request unsupported in simple view'}})+'\n');}return}let p=m.params||{};if(p.threadId&&thread&&p.threadId!==thread.id)return;if(m.method==='item/agentMessage/delta'){if(!answer)answer=add('','assistant');answer.textContent+=p.delta||'';messages.scrollTop=messages.scrollHeight}else if(m.method==='turn/completed'){turnBusy=false;let state=(p.turn&&p.turn.status)||'completed';if(state==='completed'&&thread&&p.threadId===thread.id){try{NativeSimple.taskFinished(thread.id,title.textContent,answer?answer.textContent:'')}catch(_){}}answer=null;note(state==='completed'?'Ready':'Turn '+state)}else if(m.method==='turn/started'){turnBusy=true;note('Working…')}}
function modelInfo(r){let t=r.thread||r;thread=t;title.textContent=t.name||t.preview||'Codex session';meta.textContent=(r.model||t.model||'Model unavailable')+'  ·  '+(r.reasoningEffort||t.reasoningEffort||'Effort unavailable')}
function showHistory(t){messages.textContent='';for(const turn of t.turns||[])for(const item of turn.items||[]){if(item.type==='userMessage'){let text=(item.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');if(text)add(text,'user')}else if(item.type==='agentMessage'&&item.text)add(item.text,'assistant')}}
async function list(){let r=await rpc('thread/list',{limit:50});sessions.textContent='';let first=document.createElement('option');first.value='';first.textContent='Choose a session';sessions.appendChild(first);for(const t of r.data||[]){let o=document.createElement('option');o.value=t.id;o.textContent=t.name||t.preview||'Untitled session';sessions.appendChild(o)}}
async function selectThread(key){note('Opening session…');let r=await rpc('thread/resume',{threadId:key});modelInfo(r);showHistory(r.thread);note('Ready')}
window.openCodexSession=function(key){if(!ready){window.pendingThread=key;return}selectThread(key).then(()=>{sessions.value=key}).catch(e=>note(e.message))};async function run(){try{let spec={command:'/bin/bash',args:['-lc','stty -echo -onlcr -icanon min 1 time 0; cd "$HOME" && exec codex app-server'],title:'Codex Simple View'};let create=await fetch(origin+'/api/pty',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(spec)});if(!create.ok)throw Error('Could not start Codex ('+create.status+')');let pid=(await create.json()).data.id;ptyId=pid;let ticket=await fetch(origin+'/api/pty/'+encodeURIComponent(pid)+'/connect-token',{method:'POST',credentials:'include',headers:{'x-opencode-ticket':'1'}});if(!ticket.ok)throw Error('Could not connect ('+ticket.status+')');let token=(await ticket.json()).data.ticket;let url=new URL(origin+'/api/pty/'+encodeURIComponent(pid)+'/connect');url.protocol=url.protocol==='https:'?'wss:':'ws:';url.searchParams.set('ticket',token);ws=new WebSocket(url);ws.onopen=async()=>{try{await rpc('initialize',{clientInfo:{name:'phone_simple',title:'Phone simple view',version:'1.0'}});ws.send(JSON.stringify({method:'initialized'})+'\n');ready=true;await list();let target=window.pendingThread||initialThread;if(target){window.pendingThread=null;await selectThread(target);sessions.value=target}else note('Choose a session or start a new one')}catch(e){note(e.message)}};ws.onmessage=e=>{if(typeof e.data!=='string')return;stream+=e.data;let i;while((i=stream.indexOf('\n'))>=0){let line=stream.slice(0,i).trim();stream=stream.slice(i+1);try{event(JSON.parse(line))}catch(_){}}};ws.onclose=()=>{ready=false;note('Disconnected. Reopen simple view to reconnect.')};ws.onerror=()=>note('Connection failed')}catch(e){note(e.message)}}
window.releaseTerminal=async function(){try{let deadline=Date.now()+10000;while(!ptyId&&Date.now()<deadline)await new Promise(r=>setTimeout(r,100));if(!ptyId)throw Error('Still connecting');let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000),r;try{r=await fetch(origin+'/api/pty/'+encodeURIComponent(ptyId),{method:'DELETE',credentials:'include',signal:controller.signal})}finally{clearTimeout(timer)}if(!r.ok&&r.status!==404)throw Error('Close failed');ptyId=null;if(ws){ws.onclose=null;ws.close()}NativeClose.finished(true)}catch(e){NativeClose.finished(false)}};document.getElementById('prompt').addEventListener('input',function(){this.style.height='40px';this.style.height=Math.min(this.scrollHeight,120)+'px'});sessions.onchange=()=>{if(sessions.value)selectThread(sessions.value).catch(e=>note(e.message))};document.getElementById('refresh').onclick=()=>list().catch(e=>note(e.message));document.getElementById('new').onclick=async()=>{try{let r=await rpc('thread/start',{});modelInfo(r);showHistory(r.thread);await list();sessions.value=thread.id;note('Ready')}catch(e){note(e.message)}};document.getElementById('send').onclick=async()=>{let input=document.getElementById('prompt'),text=input.value.trim();if(!text||!thread||turnBusy||!ready)return;try{input.value='';add(text,'user');answer=null;turnBusy=true;note('Working…');await rpc('turn/start',{threadId:thread.id,input:[{type:'text',text}]})}catch(e){turnBusy=false;note(e.message);input.value=text}};run();})();
</script></body></html>
