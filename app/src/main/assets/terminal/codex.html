<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><style>/*XTERM_CSS*/
html,body{margin:0;width:100%;height:100%;background:#101114;color:#f4f2ed;font-family:system-ui,sans-serif;overflow:hidden}body{display:flex;flex-direction:column}#status{padding:6px 12px;background:#1b1d22;color:#c5c5be;font-size:12px;flex:none;letter-spacing:.01em}#terminal{flex:1;min-height:0;padding:4px 4px 0 4px;overflow:hidden}.keys{display:flex;gap:6px;overflow-x:auto;background:#181a1f;padding:6px;flex:none;scrollbar-width:none;-webkit-overflow-scrolling:touch}.keys button{border:0;border-radius:9px;background:#2b2e35;color:#f4f2ed;padding:9px 13px;min-width:44px;font-size:13px;white-space:nowrap}.xterm{height:100%}
</style></head><body><div id="status">Connecting to Codex…</div><div id="terminal"></div><div class="keys"><button data-key="\u001b">Esc</button><button data-key="\t">Tab</button><button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button data-key="\u001b[D">←</button><button data-key="\u001b[C">→</button><button data-key="\u0003">Ctrl C</button><button data-key="\u0004">Ctrl D</button><button data-key="\r">Enter</button><button id="keyboard">Keyboard</button></div>
<script>/*XTERM_JS*/</script><script>/*FIT_JS*/</script><script>
(function(){'use strict';const origin=/*BASE_URL*/;const terminalName=/*TERMINAL_NAME*/;const sessionKey=/*SESSION_KEY*/;const ptySpec=/*PTY_SPEC*/;const label=document.getElementById('status');let socket=null, id=null, fitTimer=null, reconnecting=false, sentSize='', outputQueue=[], outputScheduled=false, lastWidth=0, lastHeight=0;
const term=new Terminal({cursorBlink:true,fontFamily:'monospace',fontSize:/*FONT_SIZE*/,scrollback:5000,theme:{background:'#101114',foreground:'#f4f2ed',cursor:'#d4fd71',selectionBackground:'#525d42'}});const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));term.writeln('\x1b[38;2;212;253;113mConnecting to your laptop…\x1b[0m');
term.parser.registerOscHandler(9,function(){try{NativeNotice.codexAttention()}catch(e){}return true;});
function state(t){label.textContent=t}function jsonBody(r){if(!r.ok)throw new Error(r.status===401?'Pair the laptop again':('Server error '+r.status));return r.json()}
async function resize(){if(!id)return;try{fit.fit();const size=term.cols+'x'+term.rows;if(size===sentSize)return;sentSize=size;const r=await fetch(origin+'/api/pty/'+encodeURIComponent(id),{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({size:{cols:term.cols,rows:term.rows}})});if(!r.ok)sentSize='';}catch(e){sentSize='';}}
window.fitTerminal=function(){clearTimeout(fitTimer);fitTimer=setTimeout(function(){const el=document.getElementById('terminal'),w=el.clientWidth,h=el.clientHeight;if(w===lastWidth&&h===lastHeight)return;lastWidth=w;lastHeight=h;resize()},160)};window.setTerminalFont=function(size){term.options.fontSize=Math.max(8,Math.min(24,Number(size)||12));lastWidth=0;lastHeight=0;window.fitTerminal()};window.focusTerminal=function(){term.focus()};
async function connect(){if(reconnecting)return;reconnecting=true;state('Connecting to your laptop…');try{
 let saved=localStorage.getItem(sessionKey);if(saved){let test=await fetch(origin+'/api/pty/'+encodeURIComponent(saved),{credentials:'include'});if(test.ok){let info=await test.json();if(info.data&&info.data.status==='running')id=saved;}}
 if(!id){let create=await fetch(origin+'/api/pty',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(ptySpec)}).then(jsonBody);id=create.data.id;localStorage.setItem(sessionKey,id);}
 sentSize='';lastWidth=0;lastHeight=0;await resize();let t=await fetch(origin+'/api/pty/'+encodeURIComponent(id)+'/connect-token',{method:'POST',credentials:'include',headers:{'x-opencode-ticket':'1'}}).then(jsonBody);let ws=new URL(origin+'/api/pty/'+encodeURIComponent(id)+'/connect');ws.protocol=ws.protocol==='https:'?'wss:':'ws:';ws.searchParams.set('ticket',t.data.ticket);socket=new WebSocket(ws.toString());socket.binaryType='arraybuffer';
 socket.onopen=function(){reconnecting=false;state(terminalName+' connected · tap the terminal to type');term.focus();window.fitTerminal()};socket.onmessage=function(event){if(typeof event.data!=='string')return;outputQueue.push(event.data);if(!outputScheduled){outputScheduled=true;requestAnimationFrame(function(){outputScheduled=false;const chunk=outputQueue.join('');outputQueue=[];if(chunk)term.write(chunk)})}};socket.onerror=function(){state('Connection interrupted')};socket.onclose=function(){reconnecting=false;state('Disconnected · tap here to reconnect');label.onclick=function(){label.onclick=null;id=null;connect()};};
 }catch(e){reconnecting=false;state((e.message||'Could not connect')+' · tap to retry');label.onclick=function(){label.onclick=null;id=null;connect()};}}
window.releaseTerminal=async function(){
 try{let deadline=Date.now()+10000;while(reconnecting&&Date.now()<deadline)await new Promise(r=>setTimeout(r,100));if(reconnecting)throw new Error('Connection is still starting');let target=id||localStorage.getItem(sessionKey);if(target){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);let r;try{r=await fetch(origin+'/api/pty/'+encodeURIComponent(target),{method:'DELETE',credentials:'include',signal:controller.signal});}finally{clearTimeout(timer)}if(!r.ok&&r.status!==404)throw new Error('Could not close the remote terminal');localStorage.removeItem(sessionKey);id=null;}if(socket){socket.onclose=null;socket.close();socket=null;}NativeClose.finished(true);}catch(e){NativeClose.finished(false);}
};
term.onData(function(data){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(data)});document.querySelectorAll('[data-key]').forEach(function(b){b.addEventListener('click',function(){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(b.getAttribute('data-key').replace(/\\u001b/g,'\x1b').replace(/\\u0003/g,'\x03').replace(/\\u0004/g,'\x04').replace(/\\t/g,'\t').replace(/\\r/g,'\r'));term.focus()})});document.getElementById('keyboard').addEventListener('click',()=>term.focus());window.addEventListener('resize',window.fitTerminal);new ResizeObserver(window.fitTerminal).observe(document.getElementById('terminal'));connect();})();
</script></body></html>
