<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>/*XTERM_CSS*/
html,body{margin:0;width:100%;height:100%;background:#101114;color:#f4f2ed;font-family:system-ui,sans-serif;overflow:hidden}body{display:flex;flex-direction:column}#status{padding:6px 12px;background:#1b1d22;color:#c5c5be;font-size:12px;flex:none}#terminal{flex:1;min-height:0;padding:4px 4px 0;overflow:hidden}.keys{display:flex;gap:6px;overflow-x:auto;background:#181a1f;padding:6px;flex:none;scrollbar-width:none;-webkit-overflow-scrolling:touch}.keys button{border:0;border-radius:9px;background:#2b2e35;color:#f4f2ed;padding:9px 13px;min-width:44px;font-size:13px;white-space:nowrap}.xterm{height:100%}
</style></head><body><div id="status">Starting phone shell…</div><div id="terminal"></div><div class="keys"><button data-key="\u001b">Esc</button><button data-key="\t">Tab</button><button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button data-key="\u001b[D">←</button><button data-key="\u001b[C">→</button><button data-key="\u0003">Ctrl C</button><button data-key="\u0004">Ctrl D</button><button data-key="\r">Enter</button><button id="keyboard">Keyboard</button></div>
<script>/*XTERM_JS*/</script><script>/*FIT_JS*/</script><script>
(function(){'use strict';const status=document.getElementById('status');const term=new Terminal({cursorBlink:true,fontFamily:'monospace',fontSize:/*FONT_SIZE*/,scrollback:5000,theme:{background:'#101114',foreground:'#f4f2ed',cursor:'#d4fd71',selectionBackground:'#525d42'}});const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));
let timer,lastSize='';window.fitTerminal=function(){clearTimeout(timer);timer=setTimeout(function(){try{fit.fit();const size=term.cols+'x'+term.rows;if(size!==lastSize){lastSize=size;LocalShell.resize(term.cols,term.rows)}}catch(e){}},120)};window.setTerminalFont=function(size){term.options.fontSize=Math.max(8,Math.min(24,Number(size)||12));window.fitTerminal()};window.terminalOutput=function(data){term.write(data)};window.localState=function(text){status.textContent=text};window.focusTerminal=function(){term.focus()};
term.onData(data=>LocalShell.send(data));document.querySelectorAll('[data-key]').forEach(function(b){b.addEventListener('click',function(){LocalShell.send(b.getAttribute('data-key').replace(/\\u001b/g,'\x1b').replace(/\\u0003/g,'\x03').replace(/\\u0004/g,'\x04').replace(/\\t/g,'\t').replace(/\\r/g,'\r'));term.focus()})});document.getElementById('keyboard').addEventListener('click',()=>term.focus());status.addEventListener('click',()=>{lastSize='';LocalShell.start();window.fitTerminal()});window.addEventListener('resize',window.fitTerminal);new ResizeObserver(window.fitTerminal).observe(document.getElementById('terminal'));LocalShell.start();window.fitTerminal();})();
</script></body></html>
